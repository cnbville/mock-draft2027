<!doctype html>
<html><head><meta charset="utf-8">
<!-- Mock Draft 2027 app icon. Render at 1024x1024 with a transparent background to source/icon-1024.png, then run: npx tauri icon src-tauri/icons/source/icon-1024.png -o src-tauri/icons (and delete the android, ios, Square* and StoreLogo files it adds). -->
<style>
@font-face{font-family:Archivo;src:url(../../../app/fonts/Archivo-wdth-wght.ttf) format('truetype');font-weight:100 900;font-stretch:62% 125%}
html,body{margin:0;padding:0;background:transparent}
svg{display:block}
.num{font-family:Archivo;font-weight:900;font-stretch:62%;font-variation-settings:'wdth' 62,'wght' 900;letter-spacing:14px}
</style></head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121419"/>
      <stop offset="1" stop-color="#07080b"/>
    </linearGradient>
    <!-- the room light: warm, from the top -->
    <radialGradient id="room" cx="0.62" cy="0.0" r="0.95">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity=".85"/>
      <stop offset=".38" stop-color="#d4122e" stop-opacity=".55"/>
      <stop offset=".75" stop-color="#5a0714" stop-opacity=".25"/>
      <stop offset="1" stop-color="#07080b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffd9a8" stop-opacity=".3"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07080b" stop-opacity="0"/>
      <stop offset="1" stop-color="#07080b" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="ink" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#ffe0b0"/>
      <stop offset="1" stop-color="#ffb04a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#base)"/>
  </g>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#room)"/>
    <!-- two light beams from the top right, like the hero room -->
    <g filter="url(#soft)" opacity=".9">
      <rect x="520" y="-120" width="120" height="980" fill="url(#beam)" transform="rotate(24 580 380)"/>
      <rect x="690" y="-120" width="70" height="980" fill="url(#beam)" transform="rotate(24 725 380)"/>
    </g>
    <rect x="100" y="560" width="824" height="364" fill="url(#floor)"/>
    <!-- glow under the numeral -->
    <text class="num" x="519" y="790" text-anchor="middle" font-size="690" fill="none" stroke="#ff8a2a" stroke-width="30" opacity=".42" filter="url(#glow)">27</text>
    <!-- the giant outlined numeral -->
    <text class="num" x="519" y="790" text-anchor="middle" font-size="690" fill="#ffffff" fill-opacity=".05" stroke="url(#ink)" stroke-width="18" stroke-linejoin="round">27</text>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2"/>
</svg>
</body></html>
